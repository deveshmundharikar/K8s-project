name: Backend CI

on:
  push:
    branches:
      - main
    paths:
      - 'demo-k8s-project/backend/**'
      - '.github/workflows/backend.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'demo-k8s-project/backend/**'

jobs:
  backend-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.Dockerhub_User }}
          password: ${{ secrets.Dockerhub_Token }}

      - name: Generate Image Tag
        id: prep
        run: |
          # Create a clean, unique timestamp tag (e.g., 20260529-1544)
          TAG=$(date +'%Y%m%d-%H%M%S')
          echo "tag=${TAG}" >> $GITHUB_OUTPUT
          # Also export git commit SHA as a backup tag
          echo "sha=${GITHUB_SHA::7}" >> $GITHUB_OUTPUT

      - name: Build and Push Backend Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./demo-k8s-project/backend
          push: true
          tags: |
            ${{ secrets.Dockerhub_User }}/backend:latest
            ${{ secrets.Dockerhub_User }}/backend:${{ steps.prep.outputs.tag }}
            ${{ secrets.Dockerhub_User }}/backend:${{ steps.prep.outputs.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
